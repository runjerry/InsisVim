# A status line theme generated by tmuxline.vim
# Using tmux-tokyo-night plugin instead of old tmuxline
# if-shell "test -f ~/.tmuxline" "source ~/.tmuxline"

set -g default-terminal "tmux-256color"
# Enables a true-color support in Tmux
set -ag terminal-overrides ",xterm-256color:RGB"
# Allow passthrough for OSC 52 (tmux 3.3+)
set -g allow-passthrough on

# remap prefix from 'C-b' to 'C-a'
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind '\' split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

# Moving between panes.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Re-bind last window command
bind b last-window

# Pane resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

#bind j resize-pane -D 5
#bind k resize-pane -U 5
#bind l resize-pane -R 5
#bind h resize-pane -L 5

# Smart pane switching with awareness of vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?x?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

bind -r m resize-pane -Z

bind M-c attach-session -c "#{pane_current_path}"

set -g mouse on

set-window-option -g mode-keys vi

# map prefix+u to even-horizontal
bind-key u select-layout even-horizontal

bind r source-file ~/.tmux.conf

# Vimlike copy mode.
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# for better copy-paste - use external for OSC 52 passthrough
# set -g set-clipboard on
set -g set-clipboard external

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# Enable focus events for proper Neovim FocusLost/FocusGained detection
set -g focus-events on

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Pane border.
set -g pane-border-style bg=default,fg=colour236
# set -g pane-border-fg colour236

# Active pane border
set -g pane-active-border-style bg='#556B2F',fg='#556B2F' 

# Command / message line.
set -g message-style fg=white,bg=black,bright


# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# Tokyo Night theme customization (configure before the plugin line)
# Uncomment and modify these to customize the theme:

# Color variant: 'night' (default, darker blues), 'storm' (muted), 'moon' (warmer tones)
# set -g @theme_variation 'night'

# Status bar plugins: datetime, weather, battery, playerctl, spt, homebrew, yay
# Default is 'datetime,weather'
set -g @theme_plugins 'datetime'

# Disable all plugin widgets (minimal status bar)
# set -g @theme_disable_plugins 0

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fabioluciano/tmux-tokyo-night'
# set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes


set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Override status-right to show hostname and datetime
set -g status-right '#[fg=#c0caf5]#h #[fg=#565f89]│ #[fg=#bb9af7]%Y-%m-%d %H:%M'

# Dim inactive panes (must be after TPM to avoid theme override)
# Active = dark (#0c0c10), Inactive = lighter/greyer (#181822)
set -g window-style 'fg=colour245,bg=#181822'
# set -g window-active-style 'fg=default,bg=#0c0c10'
set -g window-active-style 'fg=default,bg=#080810'

